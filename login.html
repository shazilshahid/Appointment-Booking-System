<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login / Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <section id="login-view" class="d-flex align-items-center justify-content-center min-vh-100 py-4">
  <div class="card shadow-lg p-4 rounded-4" style="max-width: 420px; width:100%;">
    <h3 class="text-center mb-3">Appointment System</h3>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3" id="authTabs">
      <li class="nav-item">
        <button class="nav-link active" id="login-tab">Login</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="signup-tab">Sign Up</button>
      </li>
    </ul>
    <!-- <h3 class="text-center mb-4 fw-bold text-primary">Login</h3> -->
    <!-- keep your login form here -->
     <!-- Login Form -->
    <form id="login-form">
      <div class="mb-3">
        <label for="login-email" class="form-label">Email</label>
        <input id="login-email" type="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="login-password" class="form-label">Password</label>
        <input id="login-password" type="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signup-form" style="display:none;">
      <div class="mb-3">
        <label for="signup-name" class="form-label">Name</label>
        <input id="signup-name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="signup-email" class="form-label">Email</label>
        <input id="signup-email" type="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="signup-password" class="form-label">Password</label>
        <input id="signup-password" type="password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="signup-role" class="form-label">Role</label>
        <select id="signup-role" class="form-select" required onchange="toggleDoctorFields()">

          <option value="client">Book an Appointment</option>
          <option value="admin">Join as a Doctor</option>
        </select>
        <!-- Doctor-only fields -->
      <div id="doctorFields" style="display:none;">
        <div class="mb-2">
          <input type="text" id="clinicName" class="form-control" placeholder="Clinic / Hospital Name">
        </div>
        <div class="mb-2">
          <input type="text" id="specialization" class="form-control" placeholder="Specialization">
        </div>
        <div class="mb-2">
          <input type="text" id="license" class="form-control" placeholder="Medical License Number">
        </div>
        <div class="mb-2">
          <input type="text" id="clinicAddress" class="form-control" placeholder="Clinic Address">
        </div>
        <div class="mb-2">
          <input type="tel" id="doctorPhone" class="form-control" placeholder="Contact Number">
        </div>
       </div>
      </div>
      <button type="submit" class="btn btn-success w-100">Sign Up</button>
    </form>
    <p class="text-center mt-3 small text-muted">⏰ All bookings follow Pakistan Standard Time (PKT)</p>
  </div>
</section>

    

  <script src="script.js"></script>
</body>
</html>
